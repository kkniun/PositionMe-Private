plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'androidx.navigation.safeargs'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('secrets.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def releaseStoreFilePath = localProperties['RELEASE_STORE_FILE'] ?: System.getenv('RELEASE_STORE_FILE')
def releaseStorePassword = localProperties['RELEASE_STORE_PASSWORD'] ?: System.getenv('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = localProperties['RELEASE_KEY_ALIAS'] ?: System.getenv('RELEASE_KEY_ALIAS')
def releaseKeyPassword = localProperties['RELEASE_KEY_PASSWORD'] ?: System.getenv('RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.openpositioning.PositionMe"
    compileSdk 35

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.openpositioning.PositionMe"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "MAPS_API_KEY",
                "\"${localProperties['MAPS_API_KEY'] ?: ''}\""
        buildConfigField "String", "OPENPOSITIONING_API_KEY",
                "\"${localProperties['OPENPOSITIONING_API_KEY'] ?: ''}\""
        buildConfigField "String", "OPENPOSITIONING_MASTER_KEY",
                "\"${localProperties['OPENPOSITIONING_MASTER_KEY'] ?: ''}\""

        manifestPlaceholders = [
                MAPS_API_KEY: localProperties['MAPS_API_KEY'] ?: ""
        ]
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0-alpha03' // or stable: 1.6.1
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation "com.google.protobuf:protobuf-java-util:3.25.3"
    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    implementation 'com.google.android.gms:play-services-maps:19.0.0'

    // Navigation components
    def nav_version = "2.8.6"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Optional: Jetpack Compose
    // implementation "androidx.compose.material3:material3:1.3.1"
    // implementation "androidx.activity:activity-compose:1.7.2"
}
